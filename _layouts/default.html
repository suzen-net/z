<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/assets/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
{% seo %}
{% feed_meta %}
<style>
  body { max-width: 42rem; margin: 2rem auto; padding: 0 1rem; font: 17px/1.6 system-ui, sans-serif; color: #222; background: #fff; }
  a { color: #0645ad; }
  header { margin-bottom: 2rem; }
  header a { color: inherit; text-decoration: none; font-weight: 600; }
  .date { color: #666; font-size: 0.9em; }
  pre { overflow-x: auto; background: #f5f5f5; padding: 0.75rem; }
  @media (prefers-color-scheme: dark) {
    body { color: #ddd; background: #111; }
    a { color: #8ab4f8; }
    .date { color: #999; }
    pre { background: #1d1d1d; }
  }
</style>
</head>
<body>
<header><a href="{{ '/' | relative_url }}">{{ site.title }}</a></header>
<main>
{{ content }}
</main>
</body>
</html>
