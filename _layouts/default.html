<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/assets/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
{% seo %}
{% feed_meta %}
<style>
  body { max-width: 42rem; margin: 2rem auto; padding: 0 1rem; font: 17px/1.6 system-ui, sans-serif; color: #222; background: #fff; }
  a { color: #0645ad; }
  header { margin-bottom: 2rem; }
  header a { color: inherit; text-decoration: none; font-weight: 600; }
  .nav { float: right; }
  .nav a { font-weight: normal; }
  .intro { display: flex; gap: 1.25rem; align-items: flex-start; }
  .intro img { border-radius: 50%; flex-shrink: 0; }
  .intro p { margin-top: 0; }
  @media (max-width: 480px) { .intro { flex-direction: column; } }
  .date { color: #666; font-size: 0.9em; }
  pre { overflow-x: auto; background: #f5f5f5; padding: 0.75rem; }
  .highlight .c, .highlight .cm, .highlight .c1, .highlight .cs { color: #6a737d; font-style: italic; }
  .highlight .cp { color: #d73a49; }
  .highlight .k, .highlight .kr, .highlight .kd, .highlight .kn, .highlight .kc { color: #d73a49; }
  .highlight .kt, .highlight .nb { color: #6f42c1; }
  .highlight .nf { color: #005cc5; }
  .highlight .s, .highlight .s1, .highlight .s2, .highlight .sc { color: #22863a; }
  .highlight .m, .highlight .mi, .highlight .mh, .highlight .mo, .highlight .mf { color: #b35900; }
  @media (prefers-color-scheme: dark) {
    body { color: #ddd; background: #111; }
    a { color: #8ab4f8; }
    .date { color: #999; }
    pre { background: #1d1d1d; }
    .highlight .c, .highlight .cm, .highlight .c1, .highlight .cs { color: #8b949e; }
    .highlight .cp, .highlight .k, .highlight .kr, .highlight .kd, .highlight .kn, .highlight .kc { color: #ff7b72; }
    .highlight .kt, .highlight .nb { color: #d2a8ff; }
    .highlight .nf { color: #79c0ff; }
    .highlight .s, .highlight .s1, .highlight .s2, .highlight .sc { color: #a5d6ff; }
    .highlight .m, .highlight .mi, .highlight .mh, .highlight .mo, .highlight .mf { color: #f0b46c; }
  }
</style>
</head>
<body>
<header><a href="{{ '/' | relative_url }}">{{ site.title }}</a> <span class="nav"><a href="{{ '/about/' | relative_url }}">About</a></span></header>
<main>
{{ content }}
</main>
</body>
</html>
